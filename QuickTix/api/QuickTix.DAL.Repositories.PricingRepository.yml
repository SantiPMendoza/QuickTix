  assemblies:
  - QuickTix.DAL
  namespace: QuickTix.DAL.Repositories
  summary: >-
    Inserta o actualiza el mapa completo de precios para un venue.

    Estrategia: reemplazo total (remove + add) dentro de transacción.

    Tras persistir, invalida caché del venue y devuelve el mapa recalculado.
  example: []
  syntax:
    content: public Task<VenuePriceMap> UpsertVenuePriceMapAsync(VenuePriceMap map)
    parameters:
    - id: map
      type: QuickTix.Core.Models.Entities.Price.VenuePriceMap
      description: Mapa de precios a guardar.
    return:
      type: System.Threading.Tasks.Task{QuickTix.Core.Models.Entities.Price.VenuePriceMap}
      description: Mapa de precios persistido y completado.
    content.vb: Public Function UpsertVenuePriceMapAsync(map As VenuePriceMap) As Task(Of VenuePriceMap)
  overload: QuickTix.DAL.Repositories.PricingRepository.UpsertVenuePriceMapAsync*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Si <code class="paramref">map</code> es null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Si el VenueId es inválido.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Si alguno de los precios es negativo.
